# The desktop app's Rust files that need no Tauri (lib.rs). The app depends on
# it by path and shares its workspace and Cargo.lock; its tests run on any
# system, from apps/desktop/src-tauri:
# cargo test --locked -p openwhisper_core
# The release workflow (.github/workflows/release.yml) runs them before building.
[package]
name = "openwhisper_core"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
# Shares one upload buffer across retries (src/openai_api.rs).
bytes = "1.11"
# Lossless upload copy of each microphone recording (src/flac_upload.rs).
flacenc = { version = "0.5", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The app's debug log lines (src/debug_log.rs); the app writes them out.
log = "0.4"
regex = "1"
# OpenAI is called from the app (src/openai_api.rs, src/realtime.rs). TLS is
# rustls with ring, as the updater already uses, and the system's
# certificates.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# The folder each transcription's FLAC upload parts are written to, deleted
# with them (src/flac_upload.rs).
tempfile = "3.26"
tokio = { version = "1.40.0", features = ["io-util", "sync", "rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = "0.7"
uuid = { version = "1.10.0", features = ["v4"] }

[dev-dependencies]
# Decodes the FLAC upload copy in its round-trip test.
claxon = "0.4"
