[package]
name = "openwhisper_desktop"
version = "0.2.27"
edition = "2021"

[lib]
name = "openwhisper_desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
anyhow = "1.0"
arboard = "3"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.3"
tauri-plugin-process = "2"
tokio = { version = "1.40.0", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
uuid = { version = "1.10.0", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# The OpenAI API key is kept in the OS credential store, never in settings.json
# (Windows Credential Manager is set up in the windows table below).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4"
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
