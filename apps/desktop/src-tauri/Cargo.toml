[package]
name = "openwhisper_desktop"
version = "0.2.27"
edition = "2021"

[lib]
name = "openwhisper_desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
anyhow = "1.0"
arboard = "3"
# The files that need no Tauri: settings, recordings, the OpenAI calls and
# the write rules (core/lib.rs).
openwhisper_core = { path = "core" }
serde = { version = "1.0", features = ["derive"] }
# Named by the code tauri::generate_context!() writes.
serde_json = "1.0"
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.3"
tauri-plugin-process = "2"
tokio = { version = "1.40.0", features = ["io-util", "sync", "rt-multi-thread", "macros", "time", "net"] }
uuid = { version = "1.10.0", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# The OpenAI API key is kept in the OS credential store, never in settings.json
# (Windows Credential Manager is set up in the windows table below).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4"
keyring = { version = "3", features = ["windows-native"] }
# The text writer's keystrokes, hooks, focus, clipboard formats and UI
# Automation (src/text_inserter.rs), and the monitor, DPI and window calls
# that place the pill (src/overlay_positioner.rs).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

