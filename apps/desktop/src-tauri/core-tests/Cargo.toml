# Runs the tests of the desktop app's Rust files that need no Tauri, on any
# system: cargo test --manifest-path apps/desktop/src-tauri/core-tests/Cargo.toml
# The release workflow (.github/workflows/release.yml) runs it before building.
[package]
name = "openwhisper_core_tests"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
flacenc = { version = "0.5", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40.0", features = ["io-util", "sync", "rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = "0.7"
uuid = { version = "1.10.0", features = ["v4"] }

[dev-dependencies]
# Decodes the FLAC upload copy in its round-trip test.
claxon = "0.4"
