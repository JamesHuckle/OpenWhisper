# Every push to main runs every test. When app code changed since the last
# release tag, it then builds signed Windows and Android releases, uploads them
# to a draft GitHub Release, checks both update feeds and publishes the draft
# as latest. Website-only pushes stop after the tests (Vercel deploys apps/web).
# The release steps live in scripts/release.mjs.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so two pushes never take the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test the release steps
        run: node --test scripts/tests/*.test.mjs
      - name: Decide the release and its version
        id: plan
        run: node scripts/release.mjs plan >> "$GITHUB_OUTPUT"

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test
      - run: npm run build

  test-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m unittest discover -s tests

  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The desktop's Rust files that need no Tauri (recordings, the WAV
      # backup, model settings, the worker link, the write rules).
      - name: Test desktop Rust logic
        working-directory: apps/desktop/src-tauri/core-tests
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test desktop UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm test

  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android unit tests
        working-directory: apps/android
        run: sh ./gradlew --no-daemon testDebugUnitTest

  build-windows:
    needs: [plan, test-web, test-worker, test-desktop, test-android]
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version ${{ needs.plan.outputs.version }}
        run: node scripts/release.mjs set-version ${{ needs.plan.outputs.version }}
      - name: Build the signed Windows installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "The TAURI_SIGNING_PRIVATE_KEY repository secret is missing. See README, Releasing a new version."
          }
          ./scripts/build-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            artifacts/windows-installer/OpenWhisper_${{ needs.plan.outputs.version }}_x64-setup.exe
            artifacts/windows-installer/OpenWhisper_${{ needs.plan.outputs.version }}_x64-setup.exe.sig
            artifacts/windows-installer/OpenWhisper_x64-setup.exe

  build-android:
    needs: [plan, test-web, test-worker, test-desktop, test-android]
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set version ${{ needs.plan.outputs.version }}
        run: node scripts/release.mjs set-version ${{ needs.plan.outputs.version }}
      - name: Install the Android toolchain
        shell: pwsh
        run: ./scripts/bootstrap-android.ps1
      - name: Restore the Android release key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENWHISPER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) {
            throw "The OPENWHISPER_ANDROID_KEYSTORE_BASE64 repository secret is missing. See README, Releasing a new version."
          }
          $keystore = Join-Path $env:RUNNER_TEMP "openwhisper-release.jks"
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "OPENWHISPER_ANDROID_KEYSTORE=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build, sign and check the Android APK
        shell: pwsh
        env:
          OPENWHISPER_ANDROID_KEY_ALIAS: ${{ secrets.OPENWHISPER_ANDROID_KEY_ALIAS }}
          OPENWHISPER_ANDROID_STORE_PASSWORD: ${{ secrets.OPENWHISPER_ANDROID_STORE_PASSWORD }}
          OPENWHISPER_ANDROID_KEY_PASSWORD: ${{ secrets.OPENWHISPER_ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: |
            apps/android/app/build/outputs/apk/public/OpenWhisper-Android-v${{ needs.plan.outputs.version }}.apk
            apps/android/app/build/outputs/apk/public/OpenWhisper-Android-v${{ needs.plan.outputs.version }}.apk.sha256
            apps/android/app/build/outputs/apk/public/OpenWhisper-Android.apk

  publish:
    needs: [plan, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish ${{ needs.plan.outputs.tag }} through a checked draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release.mjs publish
          --version ${{ needs.plan.outputs.version }}
          --assets release-assets
          --target ${{ github.sha }}
